<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Portfolio admin</title>
    <meta name="theme-color" content="#ffffff" />
    <script>
      // The same theme as the site: the last choice, else the system.
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('theme')
        } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0e0e10' : '#ffffff')
      })()
    </script>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="admin"></div>
    <noscript>The admin page needs JavaScript.</noscript>
    <script type="module" src="/src/admin/main.js"></script>
  </body>
</html>
